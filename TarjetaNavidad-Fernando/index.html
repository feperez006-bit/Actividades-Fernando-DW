<!DOCTYPE html> <!-- Esta etiqueta declara el tipo de documento-->
<html lang="es"> <!-- Esta etiqueta indica el idioma del documento-->
<head>  
    <!-- El titulo de la pagina no es visible en el desarollo pero es lo que funciona para el SEO-->
<title>Tarjeta de Navidad | Personalizados </title> 
<!--En la etiqueta head va todo lo que no es visible en la pagina web pero la hace funcional-->
<!--Acontinuacion los metadatos para que la pagina reconozca caracteres especiales se adapte a diferentes dispositivos-->
</head>
<meta charset="UTF=8"> <!--Este metadato es para los caracteres especiales-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free Web tutorials">
<meta name="author" content="Fernando Perez">

<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

<link rel="stylesheet" href="styles.css"
</head> <!--HASTA AQUI VA EL HEAD-->

<!--AQUI VA EL BODY-->
<body>
<div class="main-container">
   <!-- Cover -->
   <div class="page active" id="page-0">
    <div class="float-container">
     <img src="cover.jpg" alt="Navidad" class="cover-img">
    </div>
    <h1 class="cover-title">Feliz Navidad 2026 🎄❤️</h1>
    <p class="cover-subtitle">Con todo mi amor para ti</p>
    <button id="btn-enter" class="btn-primary">
      <span class="btn-text">Click </span>
    </button>
   </div>

<!--Mensaje pagina 1-->
<div class="page" id="pagina1">
    <div class="photo-circle">
      <img class="photo-img" loading="lazy" src="cover2.jpg" alt="imagen de navidad">
    </div>
    <p class="msg-text">Skibidi dob dob 🚽</p>
    <button id="btn-next-1" class="btn-secondary">
      <span class="btn-text">Siguiente</span>
    </button>
   </div>

<!--Mensaje pagina 2-->
<div class="page" id="pagina2">
    <h2 class="gallery-title">Feliz Navidad 2026 ✨</h2>
    <div class="gallery-grid">
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="cover3.jpg" alt="imagen de navidad">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="cover4.jpg" alt="imagen de navidad">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="cover5.jpg" alt="imagen de navidad">
     </div>
    </div>
  
    <p class="gallery-caption">Cada foto guarda un recuerdo 📸🎄</p>
   </div>

<script src="script.js"></script>

</html>
